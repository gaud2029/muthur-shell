# MU/TH/UR 6000 theme — matches muthur-shell's green phosphor look.
#
# colors.ini is generated by ThemeStore.qml (dotfiles/quickshell/muthur)
# whenever the shell's theme preset or size changes, so fuzzel always
# matches — it carries the font as well as the colors, which is why no
# font= is set below (it would override the include).
# It's gitignored — see dotfiles/fuzzel/colors.ini after first launch.
include=~/.config/fuzzel/colors.ini

[main]
prompt=">_ "
# For .desktop entries with Terminal=true (yazi, htop...).
terminal=alacritty -e
icon-theme=hicolor
lines=8
width=40
horizontal-pad=20
vertical-pad=12
inner-pad=8
anchor=bottom-left
x-margin=0
y-margin=0

[border]
width=1
radius=0
