# MU/TH/UR 6000 look for btop. The colors live in themes/muthur.theme,
# generated by ThemeStore.qml (dotfiles/quickshell/muthur) on every
# preset switch and gitignored; a running btop reloads it on SIGUSR2.
#
# Kept to the settings that matter for the look. Everything else is
# btop's default, and save_config_on_exit is off so btop never rewrites
# this tracked file with its full option dump.
color_theme = "muthur"
theme_background = true
truecolor = true
rounded_corners = false
graph_symbol = "block"
save_config_on_exit = false
