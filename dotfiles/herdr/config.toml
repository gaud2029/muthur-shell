surface0 = "#181c22"
surface1 = "#465058"
surface_dim = "#0f1216"
overlay0 = "#465058"
overlay1 = "#a8b8b8"
text = "#8ed4cc"
subtext0 = "#a8b8b8"
mauve = "#c070c8"
