selection_bg = "#6a4020"
surface0 = "#1a1210"
surface1 = "#6a4020"
surface_dim = "#0e0a08"
overlay0 = "#6a4020"
overlay1 = "#d8c0a0"
text = "#e0782c"
subtext0 = "#d8c0a0"
