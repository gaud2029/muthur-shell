# MU/TH/UR 6000 theme — matches muthur-shell's phosphor look.
#
# Nothing here is generated: only ANSI color names are used (the same
# trick as starship.toml), so yazi follows whatever palette ThemeStore.qml
# has written into alacritty's colors.toml — live, even in open windows.
# "darkgray" is color8, which the shell uses as its dim color.
#
# Borders are plain lines, labels sit in [ BRACKETS ], the hovered row is
# inverted like the shell's filled buttons, and there are no icons at all.

[mgr]
cwd = { fg = "white", bold = true }

find_keyword  = { fg = "yellow", bold = true, underline = true }
find_position = { fg = "yellow", bg = "reset", bold = true }

symlink_target = { fg = "darkgray" }

marker_copied   = { fg = "green",  bg = "green" }
marker_cut      = { fg = "red",    bg = "red" }
marker_marked   = { fg = "cyan",   bg = "cyan" }
marker_selected = { fg = "yellow", bg = "yellow" }
marker_symbol   = "▌"

count_copied   = { fg = "black", bg = "green" }
count_cut      = { fg = "black", bg = "red" }
count_selected = { fg = "black", bg = "yellow" }

border_symbol = "│"
border_style  = { fg = "white" }

[tabs]
active   = { fg = "black", bg = "white", bold = true }
inactive = { fg = "darkgray" }
sep_inner = { open = "[", close = "]" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "black", bg = "white", bold = true }
normal_alt  = { fg = "white" }
select_main = { fg = "black", bg = "yellow", bold = true }
select_alt  = { fg = "yellow" }
unset_main  = { fg = "black", bg = "red", bold = true }
unset_alt   = { fg = "red" }

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
overall   = {}
sep_left  = { open = "", close = " " }
sep_right = { open = " ", close = "" }

perm_sep   = { fg = "darkgray" }
perm_type  = { fg = "white" }
perm_read  = { fg = "green" }
perm_write = { fg = "yellow" }
perm_exec  = { fg = "cyan" }

progress_label  = { bold = true }
progress_normal = { fg = "green", bg = "black" }
progress_error  = { fg = "red", bg = "black" }

[which]
border          = { fg = "white" }
cols            = 3
mask            = {}
cand            = { fg = "white", bold = true }
rest            = { fg = "darkgray" }
desc            = { fg = "white" }
separator       = "  "
separator_style = { fg = "darkgray" }

[confirm]
border     = { fg = "white" }
title      = { fg = "white", bold = true }
body       = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}
btn_labels = [ "  [ YES ]  ", "  [ NO ]  " ]

[spot]
border   = { fg = "white" }
title    = { fg = "white", bold = true }
tbl_col  = { fg = "darkgray" }
tbl_cell = { reversed = true }

[notify]
title_info  = { fg = "green" }
title_warn  = { fg = "yellow" }
title_error = { fg = "red" }
icon_info  = "[ INFO ]"
icon_warn  = "[ WARN ]"
icon_error = "[ FAIL ]"

[pick]
border   = { fg = "white" }
active   = { reversed = true }
inactive = {}

[input]
border   = { fg = "white" }
title    = { fg = "white", bold = true }
value    = {}
selected = { reversed = true }

[cmp]
border   = { fg = "white" }
active   = { reversed = true }
inactive = {}
icon_file    = ""
icon_folder  = "/"
icon_command = ">"

[tasks]
border  = { fg = "white" }
title   = { fg = "white", bold = true }
hovered = { reversed = true }

[help]
border  = { fg = "white" }
chord   = { fg = "cyan" }
action  = {}
hovered = { reversed = true, bold = true }

# Colors by meaning, matching how the shell uses its hue slots.
[filetype]
rules = [
	{ mime = "**/image/*", fg = "cyan" },
	{ mime = "**/{audio,video}/*", fg = "cyan" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "yellow" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "magenta" },
	{ mime = "vfs/{absent,stale}", fg = "darkgray" },
	{ url = "*", is = "orphan", fg = "red" },
	{ url = "*", is = "exec"  , fg = "green" },
	{ url = "*", is = "dummy", fg = "red" },
	{ url = "*/", is = "dummy", fg = "red" },
	{ url = "*/", fg = "blue", bold = true },
]

# No icons: every rule list is empty, so a row is just its name.
[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = []
